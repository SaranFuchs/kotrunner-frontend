server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 64k;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'" always;
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_read_timeout 140s;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    add_header Cache-Control no-store;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
